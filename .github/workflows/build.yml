# =============================================================================
# Green Software Champions – CI Build
# =============================================================================
# Runs on every push to main/develop and on every pull request.
#
# Jobs
# ────
# test    – unit tests (H2 in-memory, no Docker/Keycloak needed)
# package – full JAR + frontend build, uploads the runnable artifact
# =============================================================================

name: Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  # Cancel in-progress runs for the same branch/PR (saves CI minutes)
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: compile + unit tests
  # No external services required – the test profile uses H2 in-memory.
  # ---------------------------------------------------------------------------
  test:
    name: Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [ "25" ]   # currently pinned to JDK 25; extend this list to test multiple JDK versions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven          # caches ~/.m2/repository between runs

      - name: Run unit tests
        # %test profile: H2 in-memory, OIDC disabled, Quinoa disabled
        # No Node.js needed here.
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: target/surefire-reports/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2: full package build (backend JAR + frontend via Quinoa/Vite)
  # Produces the runnable dev JAR and uploads it as a build artifact.
  # ---------------------------------------------------------------------------
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: test         # only package if tests pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Set up Node.js 20 (for Quinoa / Vite frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/main/webui/package-lock.json

      - name: Build JAR (skip tests – already run in the test job)
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      - name: Upload runnable JAR
        uses: actions/upload-artifact@v4
        with:
          name: green-software-champions-dev
          # Quinoa unpacks the frontend into the JAR; grab the dev JAR
          path: target/green-software-champions-dev.jar
          retention-days: 30
          if-no-files-found: warn

