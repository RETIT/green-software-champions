# =============================================================================
# Green Software Champions – CI Build
# =============================================================================
# Runs on every push to main and on every pull request, whatever its target
# branch.
#
# Jobs
# ────
# test    – unit tests (H2 in-memory, no Docker/Keycloak/Node.js needed)
# package – backend + frontend build, uploads the uber-jar
# =============================================================================

name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:

concurrency:
  # Cancel in-progress runs for the same branch/PR (saves CI minutes)
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: compile + unit tests
  # No external services required – the %test profile in application.yaml uses
  # H2 in-memory, no Keycloak, and disables the cloud providers and the
  # scheduler. The teams come from sample-teams.yaml.
  # ---------------------------------------------------------------------------
  test:
    name: Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [ "25" ]   # currently pinned to JDK 25; extend this list to test multiple JDK versions

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven          # caches ~/.m2/repository between runs

      - name: Run unit tests
        # Stops before the package phase, so the frontend isn't built here
        # (Quinoa is also disabled in tests) and no Node.js is needed.
        # The package job builds the frontend.
        run: mvn --batch-mode --no-transfer-progress test

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: target/surefire-reports/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2: full package build (backend + frontend via Quinoa/Vite)
  # Produces an uber-jar, a single jar with the application, its libraries and
  # the frontend, and uploads it as a build artifact.
  # ---------------------------------------------------------------------------
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: test         # only package if tests pass

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Set up Node.js 26 (for Quinoa / Vite frontend build)
        uses: actions/setup-node@v7
        with:
          node-version: "26" # LTS
          cache: npm
          cache-dependency-path: src/main/webui/package-lock.json

      - name: Build application (skip tests – already run in the test job)
        # Uber-jar (packaging into one single jar) only in CI
        # a local mvn package still builds the fast-jar
        run: mvn --batch-mode --no-transfer-progress package -DskipTests -Dquarkus.package.jar.type=uber-jar

      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: green-software-champions
          # Run with java -jar green-software-champions-<version>-runner.jar
          path: target/*-runner.jar
          retention-days: 30
          if-no-files-found: error
