name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:

concurrency:
  # Cancel superseded runs of the same branch or PR
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Needs no external services, see the %test profile in application.yaml
  test:
    name: Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [ "25" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Run unit tests
        # Stops before the package phase, so no Node.js is needed for the frontend
        run: mvn --batch-mode --no-transfer-progress test

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: target/surefire-reports/
          retention-days: 7

  # Builds the backend and, via Quinoa, the frontend into a single uber-jar
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Set up Node.js 26 (for Quinoa / Vite frontend build)
        uses: actions/setup-node@v7
        with:
          node-version: "26" # LTS
          cache: npm
          cache-dependency-path: src/main/webui/package-lock.json

      - name: Build application (skip tests – already run in the test job)
        # Uber-jar only in CI; a local mvn package builds the fast-jar
        run: mvn --batch-mode --no-transfer-progress package -DskipTests -Dquarkus.package.jar.type=uber-jar

      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: green-software-champions
          # Run with java -jar green-software-champions-<version>-runner.jar
          path: target/*-runner.jar
          retention-days: 30
          if-no-files-found: error
