# Test profile configuration
# Uses H2 in-memory database (PostgreSQL compatibility mode) instead of PostgreSQL
# Disables OIDC so tests don't need a running Keycloak instance

quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:greensoft;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=LAST

quarkus.hibernate-orm.database.generation=none
quarkus.flyway.enabled=true
quarkus.flyway.migrate-at-start=true

quarkus.oidc.enabled=false

# Disable cloud providers in tests
cloud.aws.enabled=false
cloud.azure.enabled=false
cloud.gcp.enabled=false

# Use dummy URLs for REST clients (not called in tests since providers are disabled)
quarkus.rest-client.aws-carbon-api.url=http://localhost:9999
quarkus.rest-client.azure-carbon-api.url=http://localhost:9999
quarkus.rest-client.gcp-carbon-api.url=http://localhost:9999

# Disable scheduler in tests
quarkus.scheduler.enabled=false
