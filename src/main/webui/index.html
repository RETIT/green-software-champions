<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Green Software Champions | RETIT</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* RETIT CI colors (from main.css) */
      --retit-green:        #75b729;   /* --main-color */
      --retit-green-dark:   #568139;   /* --button-main-color */
      --retit-green-darker: #426914;
      --retit-bg:           #f4fbf6;   /* style1 background */
      --retit-bg-white:     #ffffff;
      --retit-footer:       #333333;
      --retit-text:         #666666;
      --retit-text-dark:    #555555;
      --retit-text-darker:  #333333;
      --retit-text-light:   #999999;
      --retit-border:       rgba(144, 144, 144, 0.35);
      --retit-shadow:       0px 3px 10px 3px rgba(0, 0, 0, 0.08);
      --retit-shadow-card:  0px 3px 7px 2px rgba(0, 0, 0, 0.18);
      --retit-red:          #c0392b;
      --retit-gold:         #e6a817;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Source Sans 3', 'Source Sans Pro', Helvetica, sans-serif;
      background: var(--retit-bg);
      color: var(--retit-text);
      min-height: 100vh;
      font-size: 16px;
      font-weight: 300;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--retit-bg); }
    ::-webkit-scrollbar-thumb { background: rgba(117,183,41,0.3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--retit-green); }
  </style>
</head>
<body>
  <gsc-app></gsc-app>
  <script type="module" src="/src/index.js"></script>
</body>
</html>
