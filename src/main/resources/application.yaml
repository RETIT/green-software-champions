# =============================================================================
# Green Software Champions – Application Configuration
#
# ${NAME:default} reads the environment variable (or property) NAME and falls
# back to default; ${NAME} without a default is required, so the application
# refuses to start without it.
# The database file, the identity provider's URL and client secret and the
# teams file are only configured in %prod, without defaults, so production
# never falls back to a local, insecure or sample value. Dev mode stores the
# database in a file under ./data and Quarkus Dev Services provide Keycloak as
# identity provider; tests use an H2 in-memory database and no identity
# provider. Dev mode and tests use the sample teams.
# =============================================================================

quarkus:
  application:
    name: green-software-champions

  # ---------------------------------------------------------------------------
  # Teams and their cloud projects (TeamsConfig) are defined in a separate
  # file: sample-teams.yaml on the classpath here, the file named by TEAMS_FILE
  # in %prod. %prod replaces the location instead of adding to it, as lists of
  # several config files are merged entry by entry.
  # ---------------------------------------------------------------------------
  config:
    locations: sample-teams.yaml

  # ---------------------------------------------------------------------------
  # Database – H2, embedded and stored in a file (path in %dev and %prod)
  # Only one process can open the file at a time. The user has no password, as
  # it wouldn't protect the data: whoever can read the file can read the data,
  # so the file system permissions protect it.
  # ---------------------------------------------------------------------------
  datasource:
    db-kind: h2
    username: gsc

  hibernate-orm:
    # Flyway owns the schema: Hibernate neither creates nor changes it.
    schema-management:
      strategy: none

  flyway:
    migrate-at-start: true
    locations: classpath:db/migration

  # ---------------------------------------------------------------------------
  # OIDC – the identity provider: Keycloak or another OpenID Connect provider
  # (issuer URL and client secret in %prod). The README lists what other
  # providers need.
  # TLS certificates are always verified. If the identity provider uses a
  # certificate of an internal CA, add the CA to a truststore of the TLS
  # registry and reference it via quarkus.oidc.tls.tls-configuration-name
  # instead of disabling the check.
  # ---------------------------------------------------------------------------
  oidc:
    # Browsers log in with the authorization code flow: Quarkus redirects them
    # to the identity provider and keeps the tokens in an encrypted session
    # cookie, so the frontend never handles a token. Requests with an
    # "Authorization: Bearer" header, e.g. of scripts calling the admin API,
    # are authenticated by it.
    application-type: hybrid
    client-id: ${OIDC_CLIENT_ID:green-champions}
    roles:
      # Read the user's roles from the access token, as Keycloak puts its realm
      # roles only there. Providers whose access token isn't meant for this
      # application, e.g. Entra ID, need QUARKUS_OIDC_ROLES_SOURCE=idtoken.
      source: accesstoken
      # Where the providers put the roles: groups (e.g. Okta, authentik),
      # realm_access.roles (Keycloak's realm roles) and roles (Microsoft Entra
      # ID's app roles)
      role-claim-path: groups,realm_access/roles,roles
    authentication:
      # fetch() cannot follow a redirect to the identity provider, so the
      # frontend's requests (marked with X-Requested-With: JavaScript) get the
      # status 499 instead when the session has expired. The frontend then
      # reloads the page, which redirects to the identity provider and, while
      # the provider's own session is still active, straight back without
      # asking for the password.
      java-script-auto-redirect: false
      # How long the session outlives the ID token, as long as Keycloak's
      # default SSO Session Idle (30 min), during which its refresh token is valid
      session-age-extension: 30M
    token:
      # Renew expired tokens of the session with the refresh token, rather
      # than ending the session when the ID token expires (Keycloak: 5 min)
      refresh-expired: true
      # Expected audiences (aud) of the access tokens, comma-separated, only
      # checked if set. Needed if other applications' tokens come from the same
      # issuer, e.g. with Entra ID, see README. Also applies to the access token
      # of the login and replaces the client ID as the expected audience of the
      # ID tokens.
      audience: ${OIDC_AUDIENCE:}
    logout:
      # Logs out of the application and of the identity provider, then returns
      # to the dashboard, which leads to the provider's login again
      path: /logout
      post-logout-path: /

  # ---------------------------------------------------------------------------
  # Quinoa – builds the Lit frontend and serves it from this application. In
  # dev mode, it forwards the frontend requests to the Vite dev server instead.
  # ---------------------------------------------------------------------------
  quinoa:
    build-dir: dist
    ui-dir: src/main/webui
    # Port of the Vite dev server
    dev-server:
      port: 5173
    # Served by the REST endpoints, never by the frontend
    ignored-path-prefixes: /api

  # ---------------------------------------------------------------------------
  # HTTP
  # No CORS: the browser only talks to the origin it loaded the frontend from.
  # That is this application, or the Vite dev server when opened directly,
  # which then proxies /api to this application.
  # ---------------------------------------------------------------------------
  http:
    port: 8080
    # Who may access which path, before the REST endpoints check the roles.
    # The most specific path wins.
    auth:
      permission:
        # Everything requires a login, the frontend as well, so that opening
        # the dashboard redirects to the identity provider
        authenticated:
          paths: /*
          policy: authenticated
        # The admin API only accepts access tokens, not the session cookie of
        # the frontend, so that no other website can make the browser of a
        # logged-in admin call it (CSRF)
        admin-api:
          paths: /api/admin/*
          policy: authenticated
          auth-mechanism: bearer
        # Health checks of the container platform or load balancer
        health:
          paths: /q/health,/q/health/*
          policy: permit

  # ---------------------------------------------------------------------------
  # REST clients of the Azure and GCP APIs (AWS is called via its SDK)
  # ---------------------------------------------------------------------------
  rest-client:
    azure-carbon-api:
      url: ${cloud.azure.endpoint:https://management.azure.com}
      scope: jakarta.inject.Singleton
    gcp-carbon-api:
      url: ${cloud.gcp.endpoint:https://cloudbilling.googleapis.com}
      scope: jakarta.inject.Singleton

  # DEBUG for the application's own classes is enabled in %dev
  log:
    level: INFO

# =============================================================================
# Cloud Providers
# All providers are disabled by default. Without an enabled provider, no
# carbon data is synced; in dev mode, sample data is seeded instead.
# Without the AWS keys, the AWS SDK's default credentials chain is used. The
# Azure and GCP credentials are set via further cloud.azure.* and cloud.gcp.*
# properties, see CloudProvidersConfig.
# =============================================================================
cloud:
  aws:
    enabled: ${AWS_ENABLED:false}
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

  azure:
    enabled: ${AZURE_ENABLED:false}
    endpoint: ${AZURE_ENDPOINT:https://management.azure.com}

  gcp:
    enabled: ${GCP_ENABLED:false}
    endpoint: ${GCP_ENDPOINT:https://cloudbilling.googleapis.com}

# =============================================================================
# Carbon Data Sync & History
# =============================================================================
carbon:
  sync:
    # 02:00 on the 25th of every month (server time zone), as the providers
    # publish a month's data only by about the 19th (Azure) or 21st (AWS, GCP)
    # of the following month. With an enabled provider, a sync also runs at
    # every startup, which waits for it to finish.
    cron: "${CARBON_SYNC_CRON:0 0 2 25 * ?}"
    # Months fetched by each sync, ending at the previous month. The stored
    # older months are overwritten, as the providers may revise their data.
    # A month's achievements are evaluated once, as soon as every team has data
    # for it.
    months: ${CARBON_SYNC_MONTHS:12}

  history:
    # Maximum number of months the history charts show, 13 so that the same
    # month of the previous year is included. Independent of the sync, but
    # never before the earliest synced month.
    months: ${CARBON_HISTORY_MONTHS:13}

# =============================================================================
# Production profile – database file, identity provider, teams file
# =============================================================================
"%prod":
  quarkus:
    # Path of the YAML file with the teams, outside the jar, e.g.
    # /etc/green-champions/teams.yaml. Same structure as sample-teams.yaml.
    # The application refuses to start if the file does not exist or if
    # TEAMS_FILE is not set (TeamsConfig requires at least one team).
    config:
      locations: ${TEAMS_FILE}

    # Path of the H2 database file without its extension .mv.db, e.g.
    # /var/lib/green-champions/greensoft. H2 only accepts an absolute path or
    # one starting with ./ or ~/, and creates the file and its directories at
    # the first start.
    datasource:
      jdbc:
        url: jdbc:h2:file:${DB_FILE}

    # Issuer URL of the identity provider, to which Quarkus appends
    # /.well-known/openid-configuration, e.g.
    # https://keycloak.example.com/realms/green-software
    oidc:
      auth-server-url: ${OIDC_ISSUER_URL}
      credentials:
        secret: ${OIDC_CLIENT_SECRET}

# =============================================================================
# Test profile
# H2 in-memory instead of file database, so every test run starts empty, and
# no identity provider. The cloud providers (even if enabled via environment
# variables) and the scheduler are disabled and the REST clients point to a
# dummy URL, so tests never call a real cloud API.
# =============================================================================
"%test":
  cloud:
    aws:
      enabled: false
    azure:
      enabled: false
    gcp:
      enabled: false

  quarkus:
    datasource:
      jdbc:
        url: jdbc:h2:mem:greensoft;DB_CLOSE_DELAY=-1

    rest-client:
      azure-carbon-api:
        url: http://localhost:9999
      gcp-carbon-api:
        url: http://localhost:9999

    scheduler:
      enabled: false

    oidc:
      enabled: false

# =============================================================================
# Dev profile
# Quarkus Dev Services start Keycloak in a container (Docker or Podman), as no
# issuer URL is configured outside %prod.
# =============================================================================
"%dev":
  quarkus:
    # H2 database file, kept across restarts. Delete the directory ./data to
    # start with an empty database. DB_FILE overrides the path like in %prod.
    datasource:
      jdbc:
        url: jdbc:h2:file:${DB_FILE:./data/greensoft}

    oidc:
      enabled: true
      client-id: green-champions

    keycloak:
      devservices:
        enabled: true
        realm-name: green-software
        # username → password
        users:
          developer: developer
          admin: admin
        # username → realm roles, as required by @RolesAllowed
        roles:
          developer:
            - user
          admin:
            - user
            - admin

    hibernate-orm:
      log:
        sql: true
        # Uncomment to also log the values bound to the SQL parameters
        # bind-parameters: true

    log:
      category:
        "io.retit.greensoftware":
          level: DEBUG

    security:
      auth:
        # To disable authentication in dev mode change this to true
        enabled-in-dev-mode: false
