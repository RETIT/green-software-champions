# =============================================================================
# Green Software Champions – Application Configuration
#
# ${NAME:default} reads the environment variable (or property) NAME, falling
# back to default; ${NAME} without a default is required.
# The database file, identity provider and teams file are only configured in
# %prod, without defaults, so production never falls back to a local, insecure
# or sample value.
# =============================================================================

quarkus:
  application:
    name: green-software-champions

  # Teams and their cloud projects (TeamsConfig). %prod replaces the file
  # rather than adding one, as the lists of several files are merged entry by
  # entry.
  config:
    locations: sample-teams.yaml

  # H2, embedded, in a file (path in %dev and %prod) that only one process can
  # open at a time. No password: whoever can read the file can read the data,
  # so the file system permissions protect it.
  datasource:
    db-kind: h2
    username: gsc

  hibernate-orm:
    # Flyway owns the schema
    schema-management:
      strategy: none

  flyway:
    migrate-at-start: true
    locations: classpath:db/migration

  # Identity provider: Keycloak or another OpenID Connect provider, see README.
  # For a certificate of an internal CA, add the CA to a truststore of the TLS
  # registry and reference it via quarkus.oidc.tls.tls-configuration-name.
  oidc:
    # Browsers log in with the authorization code flow, keeping the tokens in
    # an encrypted session cookie; scripts send a bearer token
    application-type: hybrid
    client-id: ${OIDC_CLIENT_ID:green-champions}
    roles:
      # Keycloak puts its realm roles only in the access token. Providers whose
      # access token isn't meant for this application, e.g. Entra ID, need
      # QUARKUS_OIDC_ROLES_SOURCE=idtoken.
      source: accesstoken
      # groups (e.g. Okta, authentik), realm_access.roles (Keycloak), roles
      # (Entra ID)
      role-claim-path: groups,realm_access/roles,roles
    authentication:
      # fetch() cannot follow a redirect to the identity provider, so the
      # frontend's requests (X-Requested-With: JavaScript) get 499 instead once
      # the session has expired, and the frontend reloads the page
      java-script-auto-redirect: false
      # How long the session outlives the ID token: Keycloak's default SSO
      # Session Idle, during which its refresh token is valid
      session-age-extension: 30M
    token:
      # Renew the session's tokens rather than ending it when the ID token
      # expires (Keycloak: 5 min)
      refresh-expired: true
      # Expected audiences (aud) of all tokens, comma-separated, only checked
      # if set; for ID tokens instead of the client ID. Needed if other
      # applications' tokens come from the same issuer, see README.
      audience: ${OIDC_AUDIENCE:}
    logout:
      # Ends the session here and at the identity provider
      path: /logout
      post-logout-path: /

  # Builds and serves the frontend; in dev mode, proxies to the Vite dev server
  quinoa:
    build-dir: dist
    ui-dir: src/main/webui
    dev-server:
      port: 5173
    ignored-path-prefixes: /api

  # No CORS: the frontend is served from this origin, or from the Vite dev
  # server, which proxies /api here
  http:
    port: 8080
    # Checked before the REST endpoints check the roles. The most specific
    # path wins.
    auth:
      permission:
        # The frontend as well, so that opening the dashboard leads to the login
        authenticated:
          paths: /*
          policy: authenticated
        # Bearer tokens only, not the frontend's session cookie, against CSRF
        admin-api:
          paths: /api/admin/*
          policy: authenticated
          auth-mechanism: bearer
        # Health checks of the container platform or load balancer
        health:
          paths: /q/health,/q/health/*
          policy: permit

  # Azure and GCP APIs (AWS is called via its SDK)
  rest-client:
    azure-carbon-api:
      url: ${cloud.azure.endpoint:https://management.azure.com}
      scope: jakarta.inject.Singleton
    gcp-carbon-api:
      url: ${cloud.gcp.endpoint:https://cloudbilling.googleapis.com}
      scope: jakarta.inject.Singleton

  # DEBUG for the application's own classes is enabled in %dev
  log:
    level: INFO

# =============================================================================
# Cloud providers (CloudProvidersConfig), all disabled by default. Without an
# enabled provider, nothing is synced; in dev mode, sample data is seeded.
# =============================================================================
cloud:
  aws:
    enabled: ${AWS_ENABLED:false}
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

  azure:
    enabled: ${AZURE_ENABLED:false}
    endpoint: ${AZURE_ENDPOINT:https://management.azure.com}

  gcp:
    enabled: ${GCP_ENABLED:false}
    endpoint: ${GCP_ENDPOINT:https://cloudbilling.googleapis.com}

# =============================================================================
# Carbon Data Sync & History
# =============================================================================
carbon:
  sync:
    # 02:00 on the 25th (server time zone), as the providers publish a month's
    # data by about the 19th (Azure) or 21st (AWS, GCP) of the following month.
    # With an enabled provider, the startup also runs a sync and waits for it.
    cron: "${CARBON_SYNC_CRON:0 0 2 25 * ?}"
    # Months fetched by each sync, ending with the previous month. Older months
    # are re-fetched, as the providers may revise their data; their
    # achievements are still evaluated only once.
    months: ${CARBON_SYNC_MONTHS:12}

  history:
    # Maximum number of months the history charts show, 13 to include the same
    # month of the previous year. Never before the earliest synced month.
    months: ${CARBON_HISTORY_MONTHS:13}

# =============================================================================
# Production profile – database file, identity provider, teams file
# =============================================================================
"%prod":
  quarkus:
    # Teams file, e.g. /etc/green-champions/teams.yaml, structured like
    # sample-teams.yaml. The application refuses to start without it.
    config:
      locations: ${TEAMS_FILE}

    # H2 database file without the extension .mv.db, absolute or starting with
    # ./ or ~/, e.g. /var/lib/green-champions/greensoft. Created at the first
    # start.
    datasource:
      jdbc:
        url: jdbc:h2:file:${DB_FILE}

    # Issuer URL, e.g. https://keycloak.example.com/realms/green-software
    oidc:
      auth-server-url: ${OIDC_ISSUER_URL}
      credentials:
        secret: ${OIDC_CLIENT_SECRET}

# =============================================================================
# Test profile – in-memory database, no identity provider, and no calls of the
# cloud APIs, even if providers are enabled via environment variables
# =============================================================================
"%test":
  cloud:
    aws:
      enabled: false
    azure:
      enabled: false
    gcp:
      enabled: false

  quarkus:
    datasource:
      jdbc:
        url: jdbc:h2:mem:greensoft;DB_CLOSE_DELAY=-1

    rest-client:
      azure-carbon-api:
        url: http://localhost:9999
      gcp-carbon-api:
        url: http://localhost:9999

    scheduler:
      enabled: false

    oidc:
      enabled: false

# =============================================================================
# Dev profile – Dev Services start Keycloak in a container (Docker or Podman),
# as no issuer URL is configured outside %prod
# =============================================================================
"%dev":
  quarkus:
    # Delete ./data to start with an empty database
    datasource:
      jdbc:
        url: jdbc:h2:file:${DB_FILE:./data/greensoft}

    oidc:
      enabled: true
      client-id: green-champions

    keycloak:
      devservices:
        enabled: true
        realm-name: green-software
        # username → password
        users:
          developer: developer
          admin: admin
        # username → realm roles
        roles:
          developer:
            - user
          admin:
            - user
            - admin

    hibernate-orm:
      log:
        sql: true
        # Uncomment to also log the values bound to the SQL parameters
        # bind-parameters: true

    log:
      category:
        "io.retit.greensoftware":
          level: DEBUG

    security:
      auth:
        # false turns the security checks off in dev mode; true enforces the
        # login and roles like in production
        enabled-in-dev-mode: false
