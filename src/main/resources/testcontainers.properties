# =============================================================================
# Testcontainers configuration – Docker & Podman compatibility
# This file is read automatically from the classpath by Testcontainers.
# =============================================================================

# Disable Ryuk (the Testcontainers resource-reaper container).
# Ryuk requires privileged access to the Docker socket which is not available
# in rootless Podman. Containers are still cleaned up when the JVM exits.
ryuk.container.disabled=true

